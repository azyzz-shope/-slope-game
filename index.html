<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLOPE — AZIZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:#eafcff;font-family:Arial,sans-serif}canvas{display:block}
#hud{position:fixed;inset:18px 20px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 0 12px #00eaff;font-weight:800;letter-spacing:2px}
#score{font-size:clamp(22px,4vw,38px)}#best{font-size:14px;color:#8fefff;text-align:right}
#hint{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#b9dce7;font-size:13px;letter-spacing:1px;pointer-events:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#020611aa}
.panel{text-align:center;padding:34px 40px;border:1px solid #00d9ff88;border-radius:18px;background:#071323dd;box-shadow:0 0 45px #00bfff22;max-width:90vw}
h1{font-size:clamp(42px,9vw,76px);margin:0 0 8px;color:#efffff;text-shadow:0 0 22px #00cfff;letter-spacing:8px}
p{color:#b8dbe5;line-height:1.6}button{border:0;border-radius:8px;padding:13px 28px;background:#00d9ff;color:#001018;font-weight:900;letter-spacing:2px;cursor:pointer}
.small{font-size:11px;color:#70a9b8;margin-top:18px}
</style>
</head>
<body>
<div id="hud"><div id="score">000000</div><div id="best">BEST<br><span id="bestv">0</span></div></div>
<div id="overlay"><div class="panel"><h1 id="title">SLOPE</h1><p id="message">Dodge the red blocks. Stay on the track.<br>Use A / D or ← / → to move.</p><button id="start">START GAME</button><div class="small">A 3D ENDLESS RUNNER • AZIZ</div></div></div>
<div id="hint">A / D or ← / → TO STEER</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050812);scene.fog=new THREE.Fog(0x050812,24,105);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);camera.position.set(0,6.2,10);camera.lookAt(0,0,-8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9beeff,0x101020,1.7));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-4,10,6);light.castShadow=true;scene.add(light);
const cyan=new THREE.MeshStandardMaterial({color:0x07384a,metalness:.65,roughness:.28});const edgeMat=new THREE.MeshBasicMaterial({color:0x00dfff});
const road=new THREE.Mesh(new THREE.BoxGeometry(10,.35,150),cyan);road.position.set(0,-.35,-48);road.receiveShadow=true;scene.add(road);
for(const x of [-5.05,5.05]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.12,.16,150),edgeMat);rail.position.set(x,-.12,-48);scene.add(rail)}
const grid=new THREE.GridHelper(150,75,0x007caa,0x12394b);grid.position.set(0,-.16,-48);scene.add(grid);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.48,32,24),new THREE.MeshStandardMaterial({color:0x70ff9a,emissive:0x0b6d2a,emissiveIntensity:.8,metalness:.25,roughness:.22}));ball.castShadow=true;ball.position.set(0,.38,3);scene.add(ball);
const obstacles=[];let speed=19,score=0,playing=false,last=0,spawn=0,playerX=0;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestv'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),title=document.getElementById('title'),message=document.getElementById('message');
let best=Number(localStorage.getItem('slopeBest')||0);bestEl.textContent=best;
function obstacle(){const w=1.1+Math.random()*.7;const m=new THREE.Mesh(new THREE.BoxGeometry(w,1.3,1.1),new THREE.MeshStandardMaterial({color:0xff294d,emissive:0x6d0016,emissiveIntensity:.8,metalness:.35,roughness:.3}));m.position.set((Math.random()*7-3.5),.48,-85);m.castShadow=true;scene.add(m);obstacles.push(m)}
function reset(){for(const o of obstacles)scene.remove(o);obstacles.length=0;score=0;speed=19;spawn=0;playerX=0;ball.position.x=0;ball.position.y=.38;ball.rotation.set(0,0,0);playing=true;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function end(){playing=false;best=Math.max(best,Math.floor(score));localStorage.setItem('slopeBest',best);bestEl.textContent=best;title.textContent='GAME OVER';message.innerHTML='Score: '+Math.floor(score)+'<br>Try again and beat your best!';startBtn.textContent='RESTART';overlay.style.display='grid'}
startBtn.addEventListener('click',reset);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(keys.r&&keys.j&&playing){score+=1000;scoreEl.textContent=String(Math.floor(score)).padStart(6,'0');keys.r=false;keys.j=false}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function loop(t){if(!playing)return;const dt=Math.min((t-last)/1000,.04);last=t;score+=dt*10;speed=Math.min(37,19+score*.012);spawn-=dt;if(spawn<=0){obstacle();spawn=Math.max(.42,1.05-(speed-19)*.025)}
if(keys.a||keys.arrowleft)playerX-=dt*9;if(keys.d||keys.arrowright)playerX+=dt*9;playerX=THREE.MathUtils.clamp(playerX,-4.35,4.35);ball.position.x+=(playerX-ball.position.x)*Math.min(1,dt*13);ball.rotation.z-=dt*(keys.a||keys.arrowleft?2:keys.d||keys.arrowright?-2:0);ball.rotation.x-=dt*speed/1.4;
for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*dt;if(Math.abs(o.position.z-ball.position.z)<1.05&&Math.abs(o.position.x-ball.position.x)<(o.geometry.parameters.width/2+.42)){end();return}if(o.position.z>12){scene.remove(o);obstacles.splice(i,1)}}
camera.position.x+=(ball.position.x*.18-camera.position.x)*dt*2;camera.lookAt(ball.position.x*.2,0,-8);scoreEl.textContent=String(Math.floor(score)).padStart(6,'0');renderer.render(scene,camera);requestAnimationFrame(loop)}
function idle(){renderer.render(scene,camera);requestAnimationFrame(idle)}idle();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body></html>
